<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding for text support -->
    <meta charset="UTF-8">
    <!-- Viewport settings for responsive design across devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching Statistics | Watch Log</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Page Header with active navigation link -->
    <header>
        <nav>
            <a href="index.html">Movie Archive</a>
            <a href="detail.html">Movie Details</a>
            <a href="form.html">Add Movie</a>
            <a href="table.html" class="active">Statistics</a>
        </nav>
        <h1>Watching Statistics</h1>
    </header>

    <main>
        <!-- Summary cards grid ready for dynamic JS calculations -->
        <section class="stats-grid" id="stats-summary">
            <div class="stat-box">
                <h3>Total Movies</h3>
                <p id="totalMovies">0</p>
            </div>

            <div class="stat-box">
                <h3>Average Rating</h3>
                <p><span id="averageRating">0.0</span> / 10</p>
            </div>

            <div class="stat-box">
                <h3>Favorite Genre</h3>
                <p id="topGenre">-</p>
            </div>
        </section>

        <!-- Responsive wrapper to prevent horizontal overflow on small screens -->
        <div class="table-responsive">
            <table id="statsTable">
                <!-- Table Header defining all movie attributes -->
                <thead>
                    <tr>
                        <th>Movie Title</th>
                        <th>Genre</th>
                        <th>Release Year</th>
                        <th>Watch Date</th>
                        <th>Rating</th>
                        <th>Action</th>
                    </tr>
                </thead>
                
                <!-- Empty Table Body where JS will dynamically insert rows -->
                <tbody id="tableBody">
                    <!-- Dynamic rows (<tr> and <td>) will be generated by script.js -->
                </tbody>
            </table>
        </div>

        <!-- Empty state message shown by JS when no movies exist -->
        <p id="emptyTableMsg" class="empty-message hidden">No watching data recorded yet.</p>
    </main>

    <!-- Page Footer -->
    <footer>
        <p>CEN227 Internet Programming Project &copy; 2026 - Movie Watch Log</p>
    </footer>

    <!-- External JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
